name: learningfy

services:
  backend:
    build: ./backend
    container_name: learningfy-backend
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      # upload user (gambar/PDF) tetap ada walau container di-recreate
      - learningfy_uploads:/app/utils/upload
    healthcheck:
      # pakai 127.0.0.1 eksplisit: "localhost" bisa resolve ke ::1 (IPv6)
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: learningfy-frontend
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "3010:80"
    depends_on:
      - backend
    healthcheck:
      # pakai 127.0.0.1 eksplisit: "localhost" bisa resolve ke ::1 (IPv6)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  learningfy_uploads:

networks:
  homelab:
    external: true
